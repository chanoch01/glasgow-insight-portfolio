<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='700' viewBox='0 0 1200 700'>
  <defs>
    <style>
      .bg{fill:#F5F7FA}
      .sidebar{fill:#2E7D32}
      .card{fill:#FFFFFF;stroke:#E0E6EB;stroke-width:1;rx:8}
      .kpi{fill:#2E7D32;font-family:Segoe UI,Roboto,sans-serif}
      .kpi-sub{fill:#78909C;font-size:12px}
      .title{fill:#2E7D32;font-weight:700;font-size:20px}
      .accent{fill:#66BB6A}
      .muted{fill:#37474F}
      .small{font-size:12px}
    </style>
  </defs>
  <rect class='bg' width='1200' height='700'/>

  <!-- Left sidebar -->
  <rect x='20' y='20' width='180' height='660' rx='12' class='sidebar' opacity='0.95'/>
  <g transform='translate(60,60)'>
    <circle cx='0' cy='0' r='28' fill='#FFFFFF' opacity='0.9'/>
    <text x='0' y='6' font-size='14' text-anchor='middle' fill='#2E7D32' font-family='Segoe UI'>Admin</text>
  </g>
  <text x='40' y='140' class='small' fill='#FFFFFF'>Filters</text>
  <rect x='40' y='160' width='120' height='28' rx='6' class='card' opacity='0.95'/>
  <rect x='40' y='200' width='120' height='28' rx='6' class='card' opacity='0.95'/>
  <rect x='40' y='240' width='120' height='28' rx='6' class='card' opacity='0.95'/>

  <!-- Top KPIs -->
  <text x='230' y='50' class='title'>Recycling NetZero Dashboard</text>
  <g transform='translate(230,70)'>
    <rect x='0' y='0' width='220' height='90' rx='8' class='card'/>
    <text x='16' y='30' class='kpi' font-size='28'>35%</text>
    <text x='16' y='52' class='kpi-sub'>Overall Recycling</text>

    <rect x='240' y='0' width='220' height='90' rx='8' class='card'/>
    <text x='256' y='30' class='kpi' font-size='28'>196 t</text>
    <text x='256' y='52' class='kpi-sub'>Metal (Tons)</text>

    <rect x='480' y='0' width='220' height='90' rx='8' class='card'/>
    <text x='496' y='30' class='kpi' font-size='28'>131 t</text>
    <text x='496' y='52' class='kpi-sub'>Glass (Tons)</text>

    <rect x='720' y='0' width='220' height='90' rx='8' class='card'/>
    <text x='736' y='30' class='kpi' font-size='28'>227 t</text>
    <text x='736' y='52' class='kpi-sub'>Plastic (Tons)</text>
  </g>

  <!-- Main grid -->
  <g transform='translate(230,180)'>
    <!-- Trend chart area -->
    <rect x='0' y='0' width='470' height='320' rx='8' class='card'/>
    <text x='16' y='22' class='muted' font-weight='600'>Trend: Monthly Tons & Recycling %</text>
    <!-- placeholder sparkline -->
    <polyline points='20,260 60,220 100,240 140,180 180,200 220,160 260,180 300,140 340,160 420,120' fill='none' stroke='#0288D1' stroke-width='3' stroke-linejoin='round'/>

    <!-- Map / Choropleth -->
    <rect x='490' y='0' width='470' height='320' rx='8' class='card'/>
    <text x='506' y='22' class='muted' font-weight='600'>Map: Recycling by Ward</text>
    <!-- map placeholder grid -->
    <rect x='520' y='60' width='380' height='220' fill='#EAF6F0' rx='6'/>

    <!-- Composition and table row -->
    <rect x='0' y='340' width='320' height='240' rx='8' class='card'/>
    <text x='16' y='366' class='muted' font-weight='600'>Material Composition</text>
    <!-- donut placeholder -->
    <circle cx='160' cy='460' r='60' fill='#FFFFFF' stroke='#E0E6EB' stroke-width='1'/>
    <g>
      <rect x='340' y='340' width='620' height='240' rx='8' class='card'/>
      <text x='356' y='366' class='muted' font-weight='600'>Operational: Recent Collections & Incidents</text>
      <!-- table rows placeholders -->
      <rect x='360' y='390' width='580' height='28' rx='4' fill='#FFFFFF' opacity='0.9'/>
      <rect x='360' y='430' width='580' height='28' rx='4' fill='#FFFFFF' opacity='0.9'/>
      <rect x='360' y='470' width='580' height='28' rx='4' fill='#FFFFFF' opacity='0.9'/>
    </g>
  </g>

  <!-- Footer notes -->
  <text x='230' y='670' class='small muted'>Theme: Recycling NetZero • Last updated: 2026-06-22</text>
</svg>
